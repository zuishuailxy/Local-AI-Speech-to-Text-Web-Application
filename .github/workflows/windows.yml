name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python312:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency health
        shell: pwsh
        run: python -m pip check

      - name: Verify critical imports
        shell: pwsh
        run: |
          python -c "import sys, fastapi, faster_whisper, ctranslate2, av, onnxruntime, websockets, pytest, httpx; print(sys.version); print('imports ok')"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Install browser E2E dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install chromium

      - name: Run browser E2E
        shell: pwsh
        run: python -m pytest -q -m e2e

      # The real-model smoke steps are added in T6.10.

  windows-real-model:
    name: Windows / real model
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-e2e.txt

      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/faster-whisper-small
          key: faster-whisper-small-v1

      - name: Download real model (cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $ms = & python scripts/download_model.py --model small --source modelscope 2>&1
          $msCode = $LASTEXITCODE
          $ms | ForEach-Object { Write-Host $_ }
          if ($msCode -eq 0) { exit 0 }

          Write-Host "::warning::ModelScope download failed with exit code $msCode; trying HuggingFace"
          Remove-Item -Recurse -Force models/faster-whisper-small -ErrorAction SilentlyContinue
          $hf = & python scripts/download_model.py --model small 2>&1
          $hfCode = $LASTEXITCODE
          $hf | ForEach-Object { Write-Host $_ }
          if ($hfCode -eq 0) { exit 0 }

          Write-Host "::warning::HuggingFace download failed with exit code $hfCode; trying hf-mirror"
          Remove-Item -Recurse -Force models/faster-whisper-small -ErrorAction SilentlyContinue
          $env:HF_ENDPOINT = "https://hf-mirror.com"
          $mirror = & python scripts/download_model.py --model small 2>&1
          $mirrorCode = $LASTEXITCODE
          $mirror | ForEach-Object { Write-Host $_ }
          if ($mirrorCode -ne 0) {
            $last = ($mirror | Select-Object -Last 1)
            Write-Host "::error::All model sources failed; last error: $last"
            exit 1
          }

      - name: Verify model files
        shell: pwsh
        run: |
          Get-ChildItem models/faster-whisper-small | Select-Object Name, Length
          python -c "from pathlib import Path; p=Path('models/faster-whisper-small'); assert (p/'model.bin').is_file(); print('model ok', (p/'model.bin').stat().st_size)"

      - name: Start uvicorn and check health
        shell: pwsh
        run: |
          $process = Start-Process -FilePath python -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" -PassThru
          try {
            Start-Sleep -Seconds 5
            $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/health
            Write-Host "health status:" $response.StatusCode
            Write-Host $response.Content
            if ($response.StatusCode -ne 200) { throw "health check failed" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Record Windows runtime details
        shell: pwsh
        run: |
          $pyVersion = (python --version 2>&1) -join " "
          Write-Host "::notice::Python $pyVersion"
          $edge = python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(channel='msedge', headless=True); print(b.version); b.close(); p.stop()"
          Write-Host "::notice::Edge $edge"
          $zh = & python scripts/verify_asr.py samples/chinese.wav --language zh 2>&1
          $zh | Write-Host
          $zh | Where-Object { $_ -match '^(duration_seconds|processing_seconds):|model_load_seconds=|inference_seconds=' } | ForEach-Object { Write-Host "::notice::zh $_" }
          $en = & python scripts/verify_asr.py samples/english.wav --language en 2>&1
          $en | Write-Host
          $en | Where-Object { $_ -match '^(duration_seconds|processing_seconds):|model_load_seconds=|inference_seconds=' } | ForEach-Object { Write-Host "::notice::en $_" }

      - name: Run real-model tests
        shell: pwsh
        run: python -m pytest -q -m real_model -s

      - name: Run browser E2E on Microsoft Edge
        shell: pwsh
        env:
          PLAYWRIGHT_CHANNEL: msedge
        run: python -m pytest -q -m e2e
