name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python312:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency health
        shell: pwsh
        run: python -m pip check

      - name: Verify critical imports
        shell: pwsh
        run: |
          python -c "import sys, fastapi, faster_whisper, ctranslate2, av, onnxruntime, websockets, pytest, httpx; print(sys.version); print('imports ok')"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Install browser E2E dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install chromium

      - name: Run browser E2E
        shell: pwsh
        run: python -m pytest -q -m e2e

      # The real-model smoke steps are added in T6.10.
