<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local AI Speech-to-Text</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1d2433;
      }
      main {
        max-width: 42rem;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        margin-bottom: 0.75rem;
      }
      p {
        line-height: 1.7;
        color: #4b5565;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local AI Speech-to-Text</h1>
      <p>Web 页面骨架已就绪。录音、上传与识别界面将在后续任务中接入。</p>
    </main>
  </body>
</html>
